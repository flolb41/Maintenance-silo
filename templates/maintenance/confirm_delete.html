{% extends 'maintenance/base.html' %}
{% block title %}Confirmer la suppression{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-0 shadow-sm border-danger">
      <div class="card-header bg-danger text-white fw-semibold"><i class="bi bi-trash me-2"></i>Confirmer la suppression</div>
      <div class="card-body">
        <p>Êtes-vous sûr de vouloir supprimer <strong>{{ object }}</strong> ?</p>
        <p class="text-danger small">Cette action est irréversible.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Supprimer</button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Annuler</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
