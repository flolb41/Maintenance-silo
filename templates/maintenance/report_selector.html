{% extends "base.html" %}
{% block title %}Rapports{% endblock %}
{% block content %}
<header class="page-heading"><div><p class="eyebrow mb-1">Analyse</p><h1 class="page-title">Rapports d’activité</h1><p class="page-subtitle">Sélectionnez une période et, si nécessaire, limitez le rapport à un site.</p></div><div class="action-group"><a class="btn btn-outline-secondary" href="{% url 'site_report' %}"><i class="bi bi-buildings me-1"></i>Rapport détaillé</a><a class="btn btn-outline-primary" href="{% url 'monthly_report' current_year current_month %}"><i class="bi bi-calendar3 me-1"></i>Mois en cours</a></div></header>
<form method="post" class="card form-card app-form">
	{% csrf_token %}
	<div class="card-header"><i class="bi bi-file-earmark-bar-graph me-2 text-primary"></i>Périmètre du rapport</div>
	<div class="card-body"><div class="row g-3"><div class="col-md-4"><label class="form-label" for="report-start">Date de début</label><input id="report-start" class="form-control" type="date" name="start_date" value="{{ default_start|date:'Y-m-d' }}" required></div><div class="col-md-4"><label class="form-label" for="report-end">Date de fin</label><input id="report-end" class="form-control" type="date" name="end_date" value="{{ default_end|date:'Y-m-d' }}" required></div><div class="col-md-4"><label class="form-label" for="report-site">Site</label><select id="report-site" class="form-select" name="site"><option value="">Tous les sites</option>{% for site in sites %}<option value="{{ site.pk }}">{{ site.nom }}</option>{% endfor %}</select></div></div></div>
	<div class="card-footer form-actions"><button class="btn btn-primary" type="submit"><i class="bi bi-bar-chart me-1"></i>Afficher le rapport</button></div>
</form>
{% endblock %}
