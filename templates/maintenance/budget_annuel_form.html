{% extends "base.html" %}
{% block title %}Budget annuel{% endblock %}
{% block content %}<header class="page-heading"><div><p class="eyebrow mb-1">Pilotage financier</p><h1 class="page-title">Budget annuel</h1></div></header><form method="post" class="card form-card app-form">{% csrf_token %}<div class="card-body"><div class="row g-3">{% for field in form %}<div class="col-md-6"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>{% endif %}</div>{% endfor %}</div></div><div class="card-footer d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{% url 'budget_annuel_list' %}">Annuler</a><button class="btn btn-primary">Enregistrer</button></div></form>{% endblock %}
