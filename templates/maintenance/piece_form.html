{% extends "base.html" %}{% block title %}Nouvelle pièce{% endblock %}{% block content %}<header class="page-heading"><div><p class="eyebrow mb-1">Magasin maintenance</p><h1 class="page-title">Nouvelle pièce</h1></div></header><form method="post" class="card form-card app-form">{% csrf_token %}<div class="card-body">{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>{% endif %}</div>{% endfor %}</div><div class="card-footer form-actions"><a class="btn btn-outline-secondary" href="{% url 'piece_list' %}">Annuler</a><button class="btn btn-primary">Enregistrer</button></div></form>{% endblock %}
