<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Maintenance Silo{% endblock %}</title>
</head>
<body>
    <header>
        <nav>
            <strong>Maintenance Silo</strong>
            {% if user.is_authenticated %}
                <span>{{ user.username }}</span>
                <a href="/admin/">Administration</a>
            {% else %}
                <a href="/admin/login/">Connexion</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Maintenance Silo &mdash; Socle minimal</p>
    </footer>

    {% if user.is_authenticated %}
    <script src="/static/js/realtime.js"></script>
    {% endif %}
</body>
</html>
